<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#FFF6DC" />
<meta name="description" content="Sign in to Nexa AI — your artificial intelligence workspace." />
<title>Nexa AI — Sign in</title>

<!-- Typography: Space Grotesk (display), Inter (UI), JetBrains Mono (status) -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />

<style>
/* ============================================================
   1. DESIGN TOKENS — your palette, nothing else
   ============================================================ */
:root{
  --blue:  #425B9A;  /* primary deep blue   */
  --sky:   #76C0EC;  /* bright sky accent   */
  --cream: #FFF6DC;  /* warm cream base     */
  --pink:  #FF95A5;  /* soft pink accent    */

  /* Shades derived from the palette above (depth / text / shadow) */
  --blue-deep: #2C3E6B;  /* button base + heading ink   */
  --ink:       #26355C;  /* main text                   */
  --pink-deep: #D96A7E;  /* success base + error accent */

  --ease:   cubic-bezier(0.16, 1, 0.3, 1);      /* premium ease-out */
  --spring: cubic-bezier(0.34, 1.8, 0.64, 1);   /* bouncy pop       */
  --radius: 24px;
}

/* ============================================================
   2. BASE (element-scoped resets only)
   ============================================================ */
*, *::before, *::after{ box-sizing: border-box; }
html{ -webkit-text-size-adjust: 100%; }

body{
  margin: 0;
  min-height: 100dvh;
  font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  color: var(--ink);
  overflow-x: hidden;
  /* Cream base with soft sky + pink glows */
  background:
    radial-gradient(1000px 720px at 12% -5%,  rgba(118,192,236,.38), transparent 60%),
    radial-gradient(950px 720px at 90% 110%,  rgba(255,149,165,.32), transparent 62%),
    linear-gradient(160deg, #FFFAE9 0%, var(--cream) 55%, #FBEECB 100%);
  background-attachment: fixed;
}

a{ color: var(--blue); text-decoration: none; }
button{ font: inherit; }
::selection{ background: var(--sky); color: var(--blue-deep); }

.sr-only{
  position: absolute; width: 1px; height: 1px;
  padding: 0; margin: -1px; overflow: hidden;
  clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

a:focus-visible,
button:focus-visible,
.remember input:focus-visible + .box{
  outline: 2px solid var(--blue);
  outline-offset: 3px;
  border-radius: 6px;
}

/* ============================================================
   3. ATMOSPHERE — neural canvas, grid, orbs, grain
   ============================================================ */
#neural{
  position: fixed; inset: 0;
  width: 100%; height: 100%;
  z-index: 0;
  pointer-events: none;
}

/* Faint blueprint grid, faded toward the edges */
.grid-overlay{
  position: fixed; inset: 0;
  z-index: 0;
  pointer-events: none;
  background:
    linear-gradient(rgba(66,91,154,.055) 1px, transparent 1px),
    linear-gradient(90deg, rgba(66,91,154,.055) 1px, transparent 1px);
  background-size: 44px 44px;
  -webkit-mask-image: radial-gradient(75% 65% at 50% 45%, #000 30%, transparent 100%);
          mask-image: radial-gradient(75% 65% at 50% 45%, #000 30%, transparent 100%);
}

.ambient{ position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
.orb{ position: absolute; border-radius: 50%; filter: blur(70px); will-change: transform; }
.orb-sky{
  width: 440px; height: 440px; top: -150px; left: -130px;
  background: radial-gradient(circle at 35% 35%, rgba(118,192,236,.65), rgba(118,192,236,0) 68%);
  animation: drift-a 14s ease-in-out infinite alternate;
}
.orb-pink{
  width: 500px; height: 500px; bottom: -190px; right: -150px;
  background: radial-gradient(circle at 60% 60%, rgba(255,149,165,.6), rgba(255,149,165,0) 68%);
  animation: drift-b 18s ease-in-out infinite alternate;
}
.orb-blue{
  width: 300px; height: 300px; top: 46%; left: 54%;
  background: radial-gradient(circle, rgba(66,91,154,.16), rgba(66,91,154,0) 65%);
  animation: drift-c 22s ease-in-out infinite alternate;
}
@keyframes drift-a{ from{ transform: translate(0,0) scale(1); }        to{ transform: translate(72px,48px) scale(1.12); } }
@keyframes drift-b{ from{ transform: translate(0,0) scale(1.08); }    to{ transform: translate(-66px,-54px) scale(.94); } }
@keyframes drift-c{ from{ transform: translate(-50%,-50%) scale(1); } to{ transform: translate(-38%,-62%) scale(1.18); } }

/* Film grain — inline SVG turbulence */
body::after{
  content: "";
  position: fixed; inset: 0;
  z-index: 70;
  pointer-events: none;
  opacity: .035;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.6'/%3E%3C/svg%3E");
  background-size: 180px 180px;
}

/* Soft blue-tinted vignette */
body::before{
  content: "";
  position: fixed; inset: 0;
  z-index: 0;
  pointer-events: none;
  background: radial-gradient(120% 90% at 50% 42%, transparent 55%, rgba(66,91,154,.12) 100%);
}

/* ============================================================
   4. SCENE & CARD — glass panel, rotating gradient border
   ============================================================ */
.scene{
  position: relative;
  z-index: 1;
  min-height: 100dvh;
  display: grid;
  place-items: center;
  padding: 28px 16px;
  perspective: 1200px;
}

.card-tilt{
  width: 100%;
  max-width: 430px;
  will-change: transform; /* JS writes rotateX / rotateY here */
}

/* Frame: a rotating conic-gradient light orbiting the card edge */
.card-frame{
  position: relative;
  border-radius: calc(var(--radius) + 1px);
  padding: 1px;
  overflow: hidden;
  background: rgba(66,91,154,.14);
  box-shadow:
    0 2px 4px rgba(66,91,154,.12),
    0 18px 34px rgba(66,91,154,.18),
    0 42px 80px -18px rgba(44,62,107,.35);
  animation: card-in 1.1s var(--ease) both;
}
.card-frame::before{
  content: "";
  position: absolute;
  top: 50%; left: 50%;
  width: 160%; aspect-ratio: 1;
  transform: translate(-50%,-50%);
  background: conic-gradient(from 0deg,
    transparent 0deg,
    rgba(118,192,236,.9) 60deg,
    rgba(255,149,165,.75) 115deg,
    transparent 175deg,
    transparent 210deg,
    rgba(66,91,154,.55) 265deg,
    transparent 325deg);
  animation: orbit 7s linear infinite;
}
@keyframes orbit{
  from{ transform: translate(-50%,-50%) rotate(0deg); }
  to  { transform: translate(-50%,-50%) rotate(360deg); }
}
@keyframes card-in{
  from{ opacity: 0; transform: translateY(28px) rotateX(10deg) scale(.97); }
  to  { opacity: 1; transform: translateY(0) rotateX(0deg) scale(1); }
}

.card{
  position: relative;
  border-radius: var(--radius);
  padding: 34px 34px 26px;
  overflow: hidden;

  /* Frosted glass over a warm cream gradient */
  background: linear-gradient(165deg, rgba(255,253,244,.92) 0%, rgba(255,246,220,.88) 55%, rgba(255,240,205,.9) 100%);
  backdrop-filter: blur(18px) saturate(150%);
  -webkit-backdrop-filter: blur(18px) saturate(150%);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.9),
    inset 0 -1px 0 rgba(66,91,154,.12);
}

/* Cursor spotlight — follows the pointer via --mx / --my */
.card::before{
  content: "";
  position: absolute; inset: 0;
  border-radius: inherit;
  background: radial-gradient(340px circle at var(--mx, 50%) var(--my, -10%),
    rgba(118,192,236,.22), rgba(118,192,236,0) 65%);
  pointer-events: none;
}

/* Stitched dashed inner border (tactile detail) */
.card::after{
  content: "";
  position: absolute; inset: 9px;
  border: 1.5px dashed rgba(66,91,154,.18);
  border-radius: 17px;
  pointer-events: none;
}

.card-inner{ position: relative; z-index: 1; }

/* Staggered fade-up entrance */
.reveal{ animation: fade-up .8s var(--ease) var(--d, 0s) backwards; }
@keyframes fade-up{
  from{ opacity: 0; transform: translateY(14px); }
  to  { opacity: 1; transform: translateY(0); }
}

/* ============================================================
   5. CARD HEADER — brand mark + live status
   ============================================================ */
.card-head{
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.brand{
  display: inline-flex; align-items: center; gap: 11px;
  font-family: "Space Grotesk", sans-serif;
  font-size: 1.05rem; font-weight: 700;
  letter-spacing: .05em;
  color: var(--blue-deep);
}
.brand em{
  font-style: normal;
  background: linear-gradient(90deg, var(--blue), var(--pink-deep));
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  color: transparent;
}

/* Brand mark — gradient tile with an SVG neural-node glyph + pulse ring */
.logo-mark{
  position: relative;
  width: 36px; height: 36px;
  flex: none;
  display: grid; place-items: center;
  border-radius: 11px;
  background: linear-gradient(140deg, var(--sky) 0%, var(--blue) 58%, var(--pink) 135%);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.55),
    inset 0 -2px 4px rgba(44,62,107,.35),
    0 0 18px rgba(118,192,236,.45),
    0 5px 12px rgba(66,91,154,.3);
}
.logo-mark svg{ width: 21px; height: 21px; }
.logo-mark::after{
  content: "";
  position: absolute; inset: -1px;
  border-radius: 12px;
  border: 1px solid rgba(118,192,236,.7);
  animation: ring-pulse 2.8s var(--ease) infinite;
}
@keyframes ring-pulse{
  0%  { transform: scale(1);    opacity: .8; }
  70% { transform: scale(1.35); opacity: 0;  }
  100%{ transform: scale(1.35); opacity: 0;  }
}

/* Status pill: LED + label + live latency (updated by JS) */
.status{
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 7px 11px;
  border-radius: 999px;
  background: rgba(255,255,255,.65);
  border: 1px solid rgba(118,192,236,.5);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.9),
    inset 0 -1px 2px rgba(66,91,154,.12),
    0 2px 6px rgba(66,91,154,.12);
  font-family: "JetBrains Mono", monospace;
  font-size: .62rem; font-weight: 600;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--blue-deep);
  white-space: nowrap;
}
.led{ position: relative; width: 8px; height: 8px; flex: none; }
.led-core{
  position: absolute; inset: 0;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #FFFFFF 0%, var(--sky) 55%, var(--blue) 100%);
  box-shadow:
    0 0 9px 2px rgba(118,192,236,.75),
    0 0 20px 6px rgba(118,192,236,.35),
    inset 0 -1px 2px rgba(44,62,107,.4);
}
.led-halo{
  position: absolute; top: 50%; left: 50%;
  width: 22px; height: 22px;
  margin: -11px 0 0 -11px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(118,192,236,.55) 0%, rgba(118,192,236,0) 68%);
  animation: led-pulse 2s ease-in-out infinite;
}
@keyframes led-pulse{
  0%  { transform: scale(.55); opacity: .9; }
  70% { transform: scale(1.3);  opacity: 0;  }
  100%{ transform: scale(1.3);  opacity: 0;  }
}
.status-latency{ color: var(--blue); letter-spacing: .06em; }

/* ============================================================
   6. HEADING
   ============================================================ */
.heading{ margin-top: 26px; }
.heading h1{
  margin: 0;
  font-family: "Space Grotesk", sans-serif;
  font-size: 1.85rem;
  font-weight: 700;
  letter-spacing: -.01em;
  line-height: 1.15;
  color: var(--blue-deep);
}
.heading h1 .grad{
  background: linear-gradient(92deg, var(--blue) 10%, var(--pink-deep) 95%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  color: transparent;
}
.heading p{
  margin: 8px 0 0;
  font-size: .94rem;
  line-height: 1.55;
  color: rgba(38,53,92,.62);
}

/* ============================================================
   7. FORM — carved-in inputs with sky-blue focus glow
   ============================================================ */
form{ margin-top: 24px; }
.field{ margin-top: 17px; }
.field:first-child{ margin-top: 0; }

.field label{
  display: block;
  margin-bottom: 8px;
  font-size: .68rem;
  font-weight: 600;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: rgba(38,53,92,.55);
}

.control{ position: relative; display: flex; align-items: center; }
.field-icon{
  position: absolute; left: 14px;
  width: 19px; height: 19px;
  color: rgba(66,91,154,.4);
  pointer-events: none;
  transition: color .3s var(--ease);
}
.control:focus-within .field-icon{ color: var(--blue); }

.field input{
  width: 100%;
  padding: 14px 16px 14px 44px;
  font: inherit;
  font-size: .95rem;
  color: var(--ink);
  caret-color: var(--blue);
  border-radius: 13px;
  border: 1px solid rgba(66,91,154,.28);
  outline: none;

  /* Recessed / carved-in on the cream surface */
  background: linear-gradient(180deg, #F3EAC6 0%, #FBF2D5 100%);
  box-shadow:
    inset 0 3px 8px rgba(66,91,154,.16),
    inset 0 1px 3px rgba(66,91,154,.22),
    inset 0 -1px 0 rgba(255,255,255,.7),
    0 1px 0 rgba(255,255,255,.8);

  transition:
    box-shadow .35s var(--ease),
    border-color .35s var(--ease),
    transform .35s var(--ease);
}
.field input::placeholder{ color: rgba(38,53,92,.32); }

/* Focus: sky ring glow + 1px lift out of the recess */
.field input:focus{
  border-color: rgba(118,192,236,.9);
  transform: translateY(-1px);
  box-shadow:
    inset 0 3px 8px rgba(66,91,154,.14),
    inset 0 1px 3px rgba(66,91,154,.18),
    0 1px 0 rgba(255,255,255,.8),
    0 0 0 3px rgba(118,192,236,.35),
    0 0 24px rgba(118,192,236,.35);
}

/* Keep the carved look under browser autofill */
.field input:-webkit-autofill{
  -webkit-text-fill-color: var(--ink);
  -webkit-box-shadow: 0 0 0 60px #FBF2D5 inset, inset 0 3px 8px rgba(66,91,154,.16);
  transition: background-color 9999s ease-in-out 0s;
}

/* Error state (pink family) */
.field.has-error input{
  border-color: rgba(217,106,126,.85);
  box-shadow:
    inset 0 3px 8px rgba(66,91,154,.14),
    inset 0 1px 3px rgba(66,91,154,.18),
    0 1px 0 rgba(255,255,255,.8),
    0 0 0 3px rgba(255,149,165,.35);
}
.error, .hint{
  margin: 8px 0 0;
  font-size: .8rem;
  line-height: 1.4;
}
.error{ color: #BE4258; }
.hint{
  font-family: "JetBrains Mono", monospace;
  font-size: .7rem;
  letter-spacing: .06em;
  color: var(--pink-deep);
}
.error[hidden], .hint[hidden]{ display: none !important; }

/* Shake feedback on invalid submit (transform only) */
.field.shake .control{ animation: shake .45s var(--ease) both; }
@keyframes shake{
  10%, 90%{ transform: translateX(-1px); }
  20%, 80%{ transform: translateX(2px); }
  30%, 50%, 70%{ transform: translateX(-4px); }
  40%, 60%{ transform: translateX(4px); }
}

/* Password visibility toggle */
.control.has-toggle input{ padding-right: 50px; }
.toggle-pw{
  position: absolute; right: 6px;
  width: 38px; height: 38px;
  display: grid; place-items: center;
  border: 0; border-radius: 10px;
  background: transparent;
  color: rgba(66,91,154,.5);
  cursor: pointer;
  transition: background-color .25s var(--ease), color .25s var(--ease), transform .15s var(--ease);
}
.toggle-pw:hover{ background: rgba(118,192,236,.18); color: var(--blue-deep); }
.toggle-pw:active{ transform: scale(.92); }
.toggle-pw svg{ width: 20px; height: 20px; }
.toggle-pw .icon-eye-off{ display: none; }
.toggle-pw[aria-pressed="true"] .icon-eye{ display: none; }
.toggle-pw[aria-pressed="true"] .icon-eye-off{ display: block; }

/* ============================================================
   8. REMEMBER / FORGOT ROW
   ============================================================ */
.row{
  margin-top: 20px;
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px; flex-wrap: wrap;
}
.remember{
  position: relative;
  display: inline-flex; align-items: center; gap: 10px;
  font-size: .87rem;
  color: rgba(38,53,92,.75);
  cursor: pointer;
  user-select: none;
}
.remember input{
  position: absolute; left: 0; top: 50%;
  width: 22px; height: 22px; margin: 0;
  transform: translateY(-50%);
  opacity: 0; cursor: pointer;
}
/* Embossed box that fills blue when checked, bouncy check pop */
.remember .box{
  width: 22px; height: 22px; flex: none;
  display: grid; place-items: center;
  border-radius: 7px;
  border: 1px solid rgba(66,91,154,.3);
  background: linear-gradient(180deg, #FFFFFF, #F6EDCB);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,1),
    inset 0 -2px 4px rgba(66,91,154,.14),
    0 2px 0 rgba(66,91,154,.28),
    0 3px 6px rgba(66,91,154,.15);
  transition: background .3s var(--ease), box-shadow .3s var(--ease), transform .15s var(--ease);
}
.remember:active .box{ transform: translateY(1px); }
.remember .box svg{
  width: 12px; height: 12px;
  opacity: 0; transform: scale(.3);
  transition: opacity .2s var(--ease), transform .35s var(--spring);
}
.remember input:checked + .box{
  background: linear-gradient(180deg, var(--sky), var(--blue));
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.55),
    inset 0 -2px 4px rgba(44,62,107,.35),
    0 2px 0 var(--blue-deep),
    0 0 14px rgba(118,192,236,.5);
}
.remember input:checked + .box svg{ opacity: 1; transform: scale(1); }

.forgot{ font-size: .87rem; font-weight: 500; transition: color .25s var(--ease); }
.forgot:hover{ color: var(--blue-deep); text-decoration: underline; text-underline-offset: 3px; }

/* ============================================================
   9. PRIMARY CTA — pressable physical key (blue)
   ============================================================ */
.btn-primary{
  position: relative;
  width: 100%;
  margin-top: 26px;
  padding: 15px 20px;
  border: 1px solid rgba(44,62,107,.45);
  border-radius: 14px;
  overflow: hidden;
  cursor: pointer;

  display: flex; align-items: center; justify-content: center; gap: 10px;
  font-size: 1rem; font-weight: 600; letter-spacing: .01em;
  color: #FFFFFF;
  text-shadow: 0 1px 2px rgba(44,62,107,.5);

  /* Blue gradient keycap + gloss + solid 6px base */
  background: linear-gradient(180deg, #5D78B8 0%, var(--blue) 55%, #38507F 100%);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.5),
    inset 0 12px 14px -10px rgba(255,255,255,.4),
    inset 0 -3px 6px rgba(44,62,107,.4),
    0 6px 0 var(--blue-deep),
    0 16px 28px rgba(66,91,154,.35),
    0 0 22px rgba(118,192,236,.3);

  transition:
    transform .18s var(--ease),
    box-shadow .18s var(--ease),
    background .45s var(--ease),
    filter .3s var(--ease);
}
/* Hover: lifts 2px, base grows */
.btn-primary:hover{
  transform: translateY(-2px);
  filter: brightness(1.05);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.5),
    inset 0 12px 14px -10px rgba(255,255,255,.4),
    inset 0 -3px 6px rgba(44,62,107,.4),
    0 8px 0 var(--blue-deep),
    0 22px 34px rgba(66,91,154,.4),
    0 0 32px rgba(118,192,236,.45);
}
/* Active: pressed down 4px, base nearly swallowed */
.btn-primary:active{
  transform: translateY(4px);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.35),
    inset 0 -3px 6px rgba(44,62,107,.4),
    0 2px 0 var(--blue-deep),
    0 8px 14px rgba(66,91,154,.3);
}
/* Shine sweep on hover */
.btn-primary::after{
  content: "";
  position: absolute; inset: 0;
  background: linear-gradient(115deg, transparent 32%, rgba(255,255,255,.42) 50%, transparent 68%);
  transform: translateX(-130%);
  pointer-events: none;
}
.btn-primary:hover::after{
  transform: translateX(130%);
  transition: transform .7s var(--ease);
}
.btn-primary:disabled{ cursor: default; }

/* Success morph: blue key -> pink key */
.btn-primary.is-success{
  background: linear-gradient(180deg, #FFB0BC 0%, var(--pink) 55%, #E87B8D 100%);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.55),
    inset 0 12px 14px -10px rgba(255,255,255,.4),
    inset 0 -3px 6px rgba(190,66,88,.35),
    0 6px 0 var(--pink-deep),
    0 16px 28px rgba(217,106,126,.35),
    0 0 26px rgba(255,149,165,.45);
}

.btn-label{ position: relative; z-index: 1; display: inline-flex; align-items: center; gap: 9px; }
.btn-label .arrow{ width: 17px; height: 17px; transition: transform .3s var(--ease); }
.btn-primary:hover .arrow{ transform: translateX(3px); }
.btn-label .check{ width: 18px; height: 18px; display: none; }
.btn-primary.is-success .check{ display: block; }
.btn-primary.is-success .arrow{ display: none; }

/* Loading spinner (transform-only rotation) */
.spinner{
  width: 17px; height: 17px;
  border-radius: 50%;
  border: 2px solid rgba(255,255,255,.35);
  border-top-color: #fff;
  display: none;
  animation: spin .7s linear infinite;
}
.btn-primary.is-loading .spinner{ display: block; }
.btn-primary.is-loading .arrow{ display: none; }
@keyframes spin{ to{ transform: rotate(360deg); } }

/* ============================================================
   10. DIVIDER, SOCIAL, FOOTER
   ============================================================ */
.divider{
  margin-top: 26px;
  display: flex; align-items: center; gap: 14px;
}
.divider::before, .divider::after{ content: ""; flex: 1; height: 1px; }
.divider::before{ background: linear-gradient(90deg, transparent, rgba(66,91,154,.28)); }
.divider::after { background: linear-gradient(90deg, rgba(66,91,154,.28), transparent); }
.divider span{
  font-family: "JetBrains Mono", monospace;
  font-size: .64rem; font-weight: 500;
  letter-spacing: .18em; text-transform: uppercase;
  color: rgba(38,53,92,.45);
  white-space: nowrap;
}

.social{
  margin-top: 18px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.btn-social{
  display: inline-flex; align-items: center; justify-content: center; gap: 9px;
  padding: 12px 14px;
  border-radius: 12px;
  border: 1px solid rgba(66,91,154,.3);
  cursor: pointer;
  font-size: .92rem; font-weight: 600;
  color: var(--blue-deep);
  /* Soft raised slab on the cream surface */
  background: linear-gradient(180deg, #FFFFFF 0%, #FBF2D5 100%);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,1),
    inset 0 -2px 4px rgba(66,91,154,.1),
    0 4px 0 #D9C99A, 0 10px 18px rgba(66,91,154,.18);
  transition: transform .16s var(--ease), box-shadow .16s var(--ease), border-color .3s var(--ease);
}
.btn-social svg{ width: 19px; height: 19px; flex: none; }
.btn-social:hover{
  transform: translateY(-1px);
  border-color: rgba(118,192,236,.8);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,1),
    inset 0 -2px 4px rgba(66,91,154,.1),
    0 5px 0 #D9C99A,
    0 14px 22px rgba(66,91,154,.22),
    0 0 16px rgba(118,192,236,.25);
}
/* Physical press-down on click */
.btn-social:active{
  transform: translateY(3px);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.8),
    inset 0 -1px 2px rgba(66,91,154,.12),
    0 1px 0 #D9C99A,
    0 5px 10px rgba(66,91,154,.15);
}

.card-footer{
  margin-top: 24px;
  padding-top: 18px;
  border-top: 1px solid rgba(66,91,154,.12);
  text-align: center;
  font-size: .9rem;
  color: rgba(38,53,92,.55);
}
.card-footer a{ font-weight: 600; transition: color .25s var(--ease); }
.card-footer a:hover{ color: var(--blue-deep); text-decoration: underline; text-underline-offset: 3px; }

/* ============================================================
   11. RESPONSIVE + REDUCED MOTION
   ============================================================ */
@media (max-width: 480px){
  .card{ padding: 28px 22px 22px; }
  .card::after{ inset: 7px; }
  .heading h1{ font-size: 1.6rem; }
  .status .status-label{ display: none; } /* keep LED + latency on tiny screens */
}
@media (max-width: 360px){
  .social{ grid-template-columns: 1fr; }
  .row{ justify-content: center; }
}

@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
  }
  .reveal{ opacity: 1; }
}
</style>
</head>

<body>

  <!-- Animated neural-network background (vanilla JS canvas) -->
  <canvas id="neural" aria-hidden="true"></canvas>
  <div class="grid-overlay" aria-hidden="true"></div>
  <div class="ambient" aria-hidden="true">
    <span class="orb orb-sky"></span>
    <span class="orb orb-pink"></span>
    <span class="orb orb-blue"></span>
  </div>

  <!-- LOGIN ONLY — a single centered card, nothing else -->
  <main class="scene">
    <div class="card-tilt" id="cardTilt">
      <div class="card-frame">
        <section class="card" aria-labelledby="page-title">

            <!-- Brand + live status -->

                    <circle cx="12" cy="5" r="2.2" fill="#fff" stroke="none"/>

                    <path d="M12 7.2v3.7M10.9 13.9 6.6 16.4M13.1 13.9l4.3 2.5M7 17.2h10"/>
                  </svg>

                <span class="led" aria-hidden="true">

                <span class="status-label" aria-hidden="true">Online</span>

            </div>

            <!-- Heading -->
            <header class="heading reveal" style="--d:.2s">
              <h1 id="page-title">Welcome <span class="grad">back</span></h1>
              <p>Sign in to your AI workspace to continue where you left off.</p>
            </header>

            <form id="loginForm" novalidate>

              <!-- Email -->
              <div class="field reveal" style="--d:.32s" id="emailField">

                    <rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/>

                    <rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>
                  </svg>
                  <input id="password" name="password" type="password"
                         placeholder="Enter your password" autocomplete="current-password"
                         aria-describedby="passwordError capsHint" />
                  <button type="button" class="toggle-pw" id="togglePw"
                          aria-label="Show password" aria-pressed="false">
                    <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                      <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>
                    </svg>
                    <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                      <path d="M9.9 4.24A9.5 9.5 0 0 1 12 4c6.5 0 10 8 10 8a18.5 18.5 0 0 1-2.16 3.19M6.61 6.61A13.46 13.46 0 0 0 2 12s3.5 8 10 8a9.74 9.74 0 0 0 5.39-1.61"/>
                      <line x1="2" y1="2" x2="22" y2="22"/><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/>
                    </svg>
                  </button>
                </div>
                <p class="error" id="passwordError" role="alert" hidden></p>
                <p class="hint" id="capsHint" hidden>Caps Lock is on</p>
              </div>

              <!-- Remember / Forgot -->
              <div class="row reveal" style="--d:.56s">
                <label class="remember" for="remember">
                  <input type="checkbox" id="remember" name="remember" />
                  <span class="box" aria-hidden="true">
                    <svg viewBox="0 0 12 10" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M1 5.5 4.2 8.5 11 1.5"/>
                    </svg>
                  </span>
                  <span>Remember me</span>
                </label>
                <a class="forgot" href="#">Forgot password?</a>
              </div>

              <!-- Primary CTA -->
              <div class="reveal" style="--d:.66s">
                <button type="submit" class="btn-primary" id="signInBtn">
                  <span class="btn-label">
                    <span class="spinner" aria-hidden="true"></span>
                    <svg class="check" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                      <path d="M20 6 9 17l-5-5"/>
                    </svg>
                    <span id="signInText">Sign In</span>
                    <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                      <path d="M5 12h14M13 6l6 6-6 6"/>
                    </svg>
                  </span>
                </button>
              </div>

              <p class="sr-only" role="status" id="formStatus"></p>
            </form>

            <!-- Divider -->
            <div class="divider reveal" style="--d:.76s" aria-hidden="true">
              <span>Or continue with</span>
            </div>

            <!-- Social -->
            <div class="social reveal" style="--d:.84s">
              <button type="button" class="btn-social" id="githubBtn" aria-label="Continue with GitHub">
                <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                  <path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.55 0-.27-.01-1.17-.02-2.12-3.2.7-3.87-1.36-3.87-1.36-.52-1.33-1.28-1.68-1.28-1.68-1.04-.71.08-.7.08-.7 1.15.08 1.76 1.19 1.76 1.19 1.03 1.76 2.69 1.25 1.88-.73.4-1.25 1.28-1.54-2.55-.29-5.23-1.28-5.23-5.68 0-1.26.45-2.28 1.19-3.09-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.17 1.18a11.1 11.1 0 0 1 5.78 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.83 1.19 3.09 0 4.41-2.69 5.38-5.25 1.28.44.38.83 1.1.83 2.22 0 1.6-.01 2.9-.01 3.29 0 .3.21.67.8.55A11.51 11.51 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5Z"/>
                </svg>
                GitHub
              </button>
              <button type="button" class="btn-social" id="googleBtn" aria-label="Continue with Google">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path fill="#4285F4" d="M23.5 12.27c0-.85-.08-1.66-.22-2.45H12v4.64h6.45a5.52 5.52 0 0 1-2.39 3.58v2.97h3.87c2.26-2.09 3.57-5.16 3.57-8.74Z"/>
                  <path fill="#34A853" d="M12 24c3.24 0 5.96-1.07 7.94-2.91l-3.87-2.97c-1.07.72-2.45 1.15-4.07 1.15-3.13 0-5.78-2.11-6.73-4.96H1.29v3.07A12 12 0 0 0 12 24Z"/>
                  <path fill="#FBBC05" d="M5.27 14.31A7.2 7.2 0 0 1 4.89 12c0-.81.14-1.59.38-2.31V6.62H1.29a12 12 0 0 0 0 10.76l3.98-3.07Z"/>
                  <path fill="#EA4335" d="M12 4.73c1.76 0 3.35.61 4.6 1.8l3.44-3.44A11.98 11.98 0 0 0 12 0 12 12 0 0 0 1.29 6.62l3.98 3.07C6.22 6.84 8.87 4.73 12 4.73Z"/>
                </svg>
                Google
              </button>
            </div>

            <!-- Footer -->
            <p class="card-footer reveal" style="--d:.92s">
              New here? <a href="#">Create an account</a>
            </p>

          </div>
        </section>
      </div>
    </div>
  </main>

<script>
/* ================================================================
   Vanilla JS — no libraries, no emojis.
   1. Neural-network canvas background
   2. 3D card tilt + cursor spotlight
   3. Live latency ticker
   4. Password toggle + Caps Lock hint
   5. Validation, loading state, success morph
   6. Remember-me persistence + social feedback
   ================================================================ */
(function () {
  "use strict";

  var reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var finePointer   = window.matchMedia("(hover: hover) and (pointer: fine)").matches;

  /* ------------------------------------------------------------
     1. NEURAL NETWORK CANVAS
     Drifting nodes in blue / sky / pink; lines fade in between
     near neighbours and toward the cursor. One static frame
     is drawn for reduced-motion users.
     ------------------------------------------------------------ */
  (function neural() {
    var canvas = document.getElementById("neural");
    var ctx = canvas.getContext("2d");
    var W = 0, H = 0, nodes = [], raf = null;
    var mouse = { x: -9999, y: -9999 };
    var DPR = Math.min(window.devicePixelRatio || 1, 2);
    var LINK = 130;
    var MOUSE_LINK = 170;

    function resize() {
      W = window.innerWidth; H = window.innerHeight;
      canvas.width = W * DPR; canvas.height = H * DPR;
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      seed();
      if (reducedMotion) draw();
    }

    function seed() {
      var count = Math.min(90, Math.floor((W * H) / 20000));
      nodes = [];
      for (var i = 0; i < count; i++) {
        nodes.push({
          x: Math.random() * W,
          y: Math.random() * H,
          vx: (Math.random() - 0.5) * 0.35,
          vy: (Math.random() - 0.5) * 0.35,
          r: Math.random() * 1.6 + 0.7,
          tone: Math.random()  // picks blue / sky / pink per node
        });
      }
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);
      var i, j, a, b, dx, dy, d;

      for (i = 0; i < nodes.length; i++) {
        a = nodes[i];
        for (j = i + 1; j < nodes.length; j++) {
          b = nodes[j];
          dx = a.x - b.x; dy = a.y - b.y;
          d = Math.sqrt(dx * dx + dy * dy);
          if (d < LINK) {
            ctx.strokeStyle = "rgba(118,192,236," + ((1 - d / LINK) * 0.35).toFixed(3) + ")";
            ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
          }
        }
        dx = a.x - mouse.x; dy = a.y - mouse.y;
        d = Math.sqrt(dx * dx + dy * dy);
        if (d < MOUSE_LINK) {
          ctx.strokeStyle = "rgba(66,91,154," + ((1 - d / MOUSE_LINK) * 0.4).toFixed(3) + ")";
          ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(mouse.x, mouse.y); ctx.stroke();
        }
      }

      for (i = 0; i < nodes.length; i++) {
        a = nodes[i];
        ctx.fillStyle = a.tone < 0.55 ? "rgba(66,91,154,.55)"
                      : a.tone < 0.85 ? "rgba(118,192,236,.8)"
                      : "rgba(255,149,165,.8)";
        ctx.beginPath(); ctx.arc(a.x, a.y, a.r, 0, Math.PI * 2); ctx.fill();
      }
    }

    function step() {
      for (var i = 0; i < nodes.length; i++) {
        var n = nodes[i];
        n.x += n.vx; n.y += n.vy;
        if (n.x < -20) n.x = W + 20; if (n.x > W + 20) n.x = -20;
        if (n.y < -20) n.y = H + 20; if (n.y > H + 20) n.y = -20;
      }
      draw();
      raf = window.requestAnimationFrame(step);
    }

    window.addEventListener("resize", resize);
    window.addEventListener("pointermove", function (e) { mouse.x = e.clientX; mouse.y = e.clientY; });
    window.addEventListener("pointerleave", function () { mouse.x = -9999; mouse.y = -9999; });
    document.addEventListener("visibilitychange", function () {
      if (reducedMotion) return;
      if (document.hidden) { if (raf) window.cancelAnimationFrame(raf); raf = null; }
      else if (!raf) raf = window.requestAnimationFrame(step);
    });

    resize();
    if (!reducedMotion) raf = window.requestAnimationFrame(step);
  })();

  /* ------------------------------------------------------------
     2. 3D TILT + CURSOR SPOTLIGHT (clamped to +/-6deg, RAF-lerped)
     ------------------------------------------------------------ */
  var scene  = document.querySelector(".scene");
  var tiltEl = document.getElementById("cardTilt");
  var card   = tiltEl.querySelector(".card");

  if (finePointer && !reducedMotion) {
    var MAX_TILT = 6;
    var targetX = 0, targetY = 0, currX = 0, currY = 0, tiltRaf = null;

    function clamp(v) { return Math.max(-MAX_TILT, Math.min(MAX_TILT, v)); }

    function tick() {
      currX += (targetX - currX) * 0.085;
      currY += (targetY - currY) * 0.085;
      tiltEl.style.transform = "rotateX(" + currX.toFixed(3) + "deg) rotateY(" + currY.toFixed(3) + "deg)";
      var settled = Math.abs(targetX - currX) < 0.01 && Math.abs(targetY - currY) < 0.01;
      tiltRaf = settled ? null : window.requestAnimationFrame(tick);
    }
    function kick() { if (tiltRaf === null) tiltRaf = window.requestAnimationFrame(tick); }

    scene.addEventListener("pointermove", function (e) {
      var r = card.getBoundingClientRect();
      var px = (e.clientX - r.left) / r.width - 0.5;
      var py = (e.clientY - r.top) / r.height - 0.5;
      targetY = clamp(px * MAX_TILT * 2);
      targetX = clamp(-py * MAX_TILT * 2);
      card.style.setProperty("--mx", ((px + 0.5) * 100).toFixed(1) + "%");
      card.style.setProperty("--my", ((py + 0.5) * 100).toFixed(1) + "%");
      kick();
    });
    scene.addEventListener("pointerleave", function () {
      targetX = 0; targetY = 0;
      card.style.setProperty("--mx", "50%");
      card.style.setProperty("--my", "-10%");
      kick();
    });
  }

  /* ------------------------------------------------------------
     3. LIVE LATENCY TICKER (status pill)
     ------------------------------------------------------------ */
  var latencyEl = document.getElementById("latency");
  window.setInterval(function () {
    latencyEl.textContent = (8 + Math.floor(Math.random() * 17)) + "ms";
  }, 2200);

  /* ------------------------------------------------------------
     4. PASSWORD TOGGLE + CAPS LOCK HINT
     ------------------------------------------------------------ */
  var pwInput  = document.getElementById("password");
  var pwToggle = document.getElementById("togglePw");
  var capsHint = document.getElementById("capsHint");

  pwToggle.addEventListener("click", function () {
    var show = pwInput.type === "password";
    pwInput.type = show ? "text" : "password";
    pwToggle.setAttribute("aria-pressed", String(show));
    pwToggle.setAttribute("aria-label", show ? "Hide password" : "Show password");
    pwInput.focus();
  });

  pwInput.addEventListener("keydown", function (e) {
    if (e.getModifierState) capsHint.hidden = !e.getModifierState("CapsLock");
  });
  pwInput.addEventListener("keyup", function (e) {
    if (e.getModifierState) capsHint.hidden = !e.getModifierState("CapsLock");
  });
  pwInput.addEventListener("blur", function () { capsHint.hidden = true; });

  /* ------------------------------------------------------------
     5. VALIDATION + SUBMIT FLOW
     Errors -> shake. Valid -> spinner ("Authenticating") ->
     success morph ("Access Granted" + SVG check) -> reset.
     ------------------------------------------------------------ */
  var form        = document.getElementById("loginForm");
  var emailInput  = document.getElementById("email");
  var rememberBox = document.getElementById("remember");
  var signInBtn   = document.getElementById("signInBtn");
  var signInText  = document.getElementById("signInText");
  var formStatus  = document.getElementById("formStatus");
  var EMAIL_RE    = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  var busy = false;

  function setError(fieldId, input, errorId, message) {
    var field = document.getElementById(fieldId);
    var error = document.getElementById(errorId);
    if (message) {
      error.textContent = message;
      error.hidden = false;
      field.classList.add("has-error");
      input.setAttribute("aria-invalid", "true");
      field.classList.remove("shake");
      void field.offsetWidth; // reflow so the shake replays
      field.classList.add("shake");
    } else {
      error.textContent = "";
      error.hidden = true;
      field.classList.remove("has-error");
      input.removeAttribute("aria-invalid");
    }
  }

  function validateEmail() {
    var v = emailInput.value.trim();
    if (!v)                { setError("emailField", emailInput, "emailError", "Please enter your email address."); return false; }
    if (!EMAIL_RE.test(v)) { setError("emailField", emailInput, "emailError", "That does not look like a valid email address."); return false; }
    setError("emailField", emailInput, "emailError", "");
    return true;
  }

  function validatePassword() {
    var v = pwInput.value;
    if (!v)           { setError("passwordField", pwInput, "passwordError", "Please enter your password."); return false; }
    if (v.length < 8) { setError("passwordField", pwInput, "passwordError", "Password must be at least 8 characters."); return false; }
    setError("passwordField", pwInput, "passwordError", "");
    return true;
  }

  emailInput.addEventListener("input", function () { setError("emailField", emailInput, "emailError", ""); });
  pwInput.addEventListener("input",    function () { setError("passwordField", pwInput, "passwordError", ""); });
  emailInput.addEventListener("blur",  function () { if (emailInput.value) validateEmail(); });
  pwInput.addEventListener("blur",     function () { if (pwInput.value) validatePassword(); });

  /* Remember-me persistence */
  var STORAGE_KEY = "nexa-ai.email";
  try {
    var saved = window.localStorage.getItem(STORAGE_KEY);
    if (saved) { emailInput.value = saved; rememberBox.checked = true; }
  } catch (err) { /* storage unavailable — no-op */ }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    if (busy) return;

    var emailOk = validateEmail();
    var pwOk = validatePassword();
    if (!emailOk || !pwOk) {
      (emailOk ? pwInput : emailInput).focus();
      return;
    }

    try {
      if (rememberBox.checked) window.localStorage.setItem(STORAGE_KEY, emailInput.value.trim());
      else window.localStorage.removeItem(STORAGE_KEY);
    } catch (err) { /* ignore */ }

    /* Phase 1: authenticating */
    busy = true;
    signInBtn.disabled = true;
    signInBtn.classList.add("is-loading");
    signInText.textContent = "Authenticating";
    formStatus.textContent = "Authenticating your credentials.";

    window.setTimeout(function () {
      /* Phase 2: success morph (blue -> pink) */
      signInBtn.classList.remove("is-loading");
      signInBtn.classList.add("is-success");
      signInText.textContent = "Access Granted";
      formStatus.textContent = "Access granted. Welcome back.";

      window.setTimeout(function () {
        /* Phase 3: reset */
        signInBtn.classList.remove("is-success");
        signInText.textContent = "Sign In";
        signInBtn.disabled = false;
        busy = false;
        formStatus.textContent = "";
      }, 1600);
    }, 950);
  });

  /* ------------------------------------------------------------
     6. SOCIAL BUTTONS — press feedback (wire to OAuth endpoints)
     ------------------------------------------------------------ */
  function socialFeedback(btn, provider) {
    if (btn.disabled) return;
    var original = btn.lastChild.textContent;
    btn.disabled = true;
    btn.lastChild.textContent = " Connecting...";
    formStatus.textContent = "Redirecting to " + provider + ".";
    window.setTimeout(function () {
      btn.lastChild.textContent = original;
      btn.disabled = false;
      formStatus.textContent = "";
    }, 1200);
  }
  document.getElementById("githubBtn").addEventListener("click", function () { socialFeedback(this, "GitHub"); });
  document.getElementById("googleBtn").addEventListener("click", function () { socialFeedback(this, "Google"); });
})();
</script>
